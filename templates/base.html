<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TechStore Maly{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>

<body>

<!-- Componente reutilizable: navbar -->
{% include "components/navbar.html" %}

<!-- BLOQUE: ENCABEZADO (HERO) -->
<header>
    {% block header %}
        <h1 class="logo-tech">{{ nombre_tienda|upper }}</h1>
        <p class="lead">{{ eslogan_tienda }}</p>
    {% endblock %}
</header>

<!-- BLOQUE: CONTENIDO PRINCIPAL (varia segun la pagina) -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- Componente reutilizable: footer -->
{% include "components/footer.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}

</body>
</html>
